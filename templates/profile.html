<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | SmartHouse AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
            🏠 SmartHouse AI
        </a>

        <div>
            <a class="btn btn-outline-light btn-sm me-2"
               href="{{ url_for('main.dashboard') }}">
                Dashboard
            </a>

            <a class="btn btn-light btn-sm"
               href="{{ url_for('auth.logout') }}">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <div
                            class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center"
                            style="width:90px;height:90px;font-size:40px;"
                        >
                            👤
                        </div>

                        <h2 class="fw-bold mt-3">
                            My Profile
                        </h2>

                    </div>

                    {% if current_user.is_authenticated %}

                    <div class="row g-3">

                        <div class="col-12">
                            <label class="form-label text-muted">
                                Full Name
                            </label>

                            <div class="form-control bg-light">
                                {{ current_user.name }}
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-muted">
                                Email
                            </label>

                            <div class="form-control bg-light">
                                {{ current_user.email }}
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted">
                                Role
                            </label>

                            <div class="form-control bg-light">
                                {{ current_user.role|capitalize }}
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-muted">
                                Account Created
                            </label>

                            <div class="form-control bg-light">
                                {{ current_user.created_at.strftime('%d %b %Y') }}
                            </div>
                        </div>

                    </div>

                    {% else %}

                    <div class="alert alert-warning">
                        Please login to view your profile.
                    </div>

                    <a href="{{ url_for('auth.login') }}"
                       class="btn btn-primary">
                        Login
                    </a>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
